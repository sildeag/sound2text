# Cap the main Gradle process memory footprint sharply
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:+UseG1GC

# Strictly limit the background Kotlin compiler daemon memory
kotlin.daemon.jvmargs=-Xmx1024m

# Disable memory-intensive parallel task processing on this machine
org.gradle.parallel=false
org.gradle.workers.max=2

# Keep caching enabled to preserve progress
org.gradle.caching=true

# 1. CRITICAL SPEEDUP: Cache your configuration graph completely
# Bypasses the configuration phase entirely on subsequent builds.
org.gradle.configuration-cache=true
# 2. MEMORY CEILING: Prevent Gradle from choking an 8GB system
# Leaving breathing room for your IDE prevents your OS from hitting heavy SSD swap.
#org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:+UseParallelGC -Dfile.encoding=UTF-8
# 3. CONCURRENCY CONTROL: Restrict parallel threads for 4-Core CPUs
# Restricting to 2 max workers keeps the machine from freezing under parallel thread overhead.
#org.gradle.workers.max=2
#org.gradle.parallel=true
# 4. ARTIFACT REUSE: Cache compiled code blocks between tasks
#org.gradle.caching=true
org.gradle.daemon=true

# Kotlin settings
kotlin.code.style=official

# Android build optimizations
android.nonTransitiveRClass=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.useAndroidX=true
android.enableJetifier=true

# Allow Kotlin source sets in Android modules
android.disallowKotlinSourceSets=false
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
kotlin.mpp.androidSourceSetLayoutV2=true
kotlin.mpp.enableCInteropCommonization=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=false


