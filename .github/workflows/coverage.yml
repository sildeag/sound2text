name: Coverage

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Debug workspace
        run: |
          echo "PWD:"
          pwd
          echo "Root listing:"
          ls -al .
          echo "Gradle folder:"
          ls -al gradle || echo "gradle folder missing"
          echo "Wrapper folder:"
          ls -al gradle/wrapper || echo "wrapper folder missing"

      - name: Run targeted coverage
        run: ./gradlew jacocoRootReport

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/jacoco/jacocoRootReport/html
