# ============================================================
#                     VERSION CATALOG
#        Clean, cohesive, and modern Kotlin/Compose setup
# ============================================================

[versions]

# --- Core Toolchains (Upgraded to Modern Stack) ---
kotlin-ver = "2.3.20"             # was 2.1.10
agp = "9.3.0-alpha09"             # was 9.2.1 and earlier 8.8.0
jvm = "24"

android-compileSdk = "36"         # was 35
android-minSdk = "24"
android-targetSdk = "36"         # was 35

# --- Compose ---
compose-mpp = "1.7.3"             # was 1.7.3, 1.10.3 and 2.8.0 (all had issues)
compose-mpp-androidx = "2.8.3"    # Dedicated version for JetBrains androidx adapters
compose-compiler = "2.3.20"       # Matches Kotlin version
compose-bom-ver = "2026.03.01"    # was 2025.02.00

activity-compose = "1.12.3"       # was 1.9.3

# Koin + KSP ---
koin = "4.2.0"                    # was 4.1.1
koin-annotations-ver = "2.3.1"    # was 1.4.0
koin-compiler-ver = "2.3.1"       # was 1.4.0
ksp-ver = "2.3.8"


# --- Coroutines ---
coroutines = "1.10.2"             # was 1.10.1

# --- Testing ---
junit5-ver = "6.0.2"              # was 5.11.0
androidx-junit-ver = "1.3.0"      # was 1.2.1
espresso-ver = "3.7.0"            # was 3.6.1
kotlin-test-ver = "2.3.20"         # was 2.1.10

# --- JavaFX ---
javafx-ver = "21.0.2"                 # was 23.0.1

# --- Logging ---
slf4j = "2.0.17"                  # was 2.0.16
logback = "1.5.24"                # was 1.5.12
kotlin-logging = "7.0.14"         # was 7.0.0

# --- iText ---
itext-ver = "9.5.0"               # was 8.0.5

# --- Misc ---
kotlinxSerialization = "1.9.0"    # was 1.7.3
mockk-ver = "1.14.7"              # was 1.13.13
jna-ver = "5.18.1"                # was 5.15.0
snakeyaml-ver = "2.5"             # was 2.3
dokka-ver = "2.2.0"               # was 2.1.0
vosk-ver = "0.3.38"
vosk-ver-android = "0.3.75"
controlsfx-ver = "12.3.1"         # was 11.2.1
tilesfx-ver = "21.0.9"            # was 21.0.3
formsfx-ver = "11.6.0"
ikonli-ver = "12.4.0"             # was 12.3.1
cardview-ver = "1.0.0"
jacoco-ver = "0.8.12"
javafx-plugin-ver = "0.1.0"
voyager-ver = "1.0.0"

# --- SQLite ---
#room-ver = "2.7.0"
sqlite-jdbc-ver = "3.45.1.0"
spatialite-android-ver = "2.0.0"
sqlite-bundled-ver = "2.5.0"
sqliteFramework = "2.6.2"


# ============================================================
#                          PLUGINS
# ============================================================

[plugins]
# Kotlin
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp-ver" }
#room = { id = "androidx.room", version.ref = "room-ver" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin-ver" }
kotlinJvm           = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin-ver" }

# Android
androidLibrary      = { id = "com.android.library", version.ref = "agp" }
androidApplication  = { id = "com.android.application", version.ref = "agp" }
androidKmp          = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }


# Compose
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-mpp" }
composeDesktopApp    = { id = "org.jetbrains.compose.desktop.application", version.ref = "compose-mpp" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin-ver" }


# Tooling
# ksp   = { id = "com.google.devtools.ksp", version.ref = "ksp-ver" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka-ver" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin-ver" }
javafx = { id = "org.openjfx.javafxplugin", version.ref = "javafx-plugin-ver" }

# ============================================================
#                         LIBRARIES
# ============================================================

[libraries]

# --- Plugin Artifacts (Required for build-logic) ---
android-gradle-plugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin-ver" }
kotlin-serialization-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-serialization", version.ref = "kotlin-ver" }
compose-gradle-plugin = { group = "org.jetbrains.compose", name = "compose-gradle-plugin", version.ref = "compose-mpp" }
compose-compiler-gradle-plugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin-ver" }
ksp-gradle-plugin = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp-ver" }
#room-gradle-plugin = { group = "androidx.room", name = "room-gradle-plugin", version.ref = "room-ver" }
dokka-gradle-plugin = { group = "org.jetbrains.dokka", name = "dokka-gradle-plugin", version.ref = "dokka-ver" }
javafx-gradle-plugin = { module = "org.openjfx.javafxplugin:org.openjfx.javafxplugin.gradle.plugin", version.ref = "javafx-plugin-ver" }

# --- AndroidX Core ---
core-ktx = { module = "androidx.core:core-ktx", version = "1.18.0" } # was 1.17.0
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version = "2.10.0" }

# --- Compose (AndroidX) ---
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom-ver" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material = { module = "androidx.compose.material:material" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }

# --- Compose Multiplatform (JetBrains) ---
compose-mpp-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "compose-mpp" }
compose-mpp-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "compose-mpp" }
compose-mpp-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "compose-mpp" }
#  CORRECT VERSION CATALOG SYNTAX
compose-mpp-viewmodel = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "compose-mpp-androidx" }



# --- Koin ---
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-android = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }
koin-annotations = { module = "io.insert-koin:koin-annotations", version.ref = "koin-annotations-ver" }
# koin-compiler = { module = "io.insert-koin:koin-ksp-compiler", version.ref = "koin-compiler-ver" } # Disabled as KSP not used
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }
koin-test-junit5 = { module = "io.insert-koin:koin-test-junit5", version.ref = "koin" }

# --- Coroutines ---
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# --- JUnit 5 ---
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit5-ver" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit5-ver" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit5-ver" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-junit-ver" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso-ver" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin-test-ver" }

# --- JavaFX ---
javafx-base = { module = "org.openjfx:javafx-base", version.ref = "javafx-ver" }
javafx-controls = { module = "org.openjfx:javafx-controls", version.ref = "javafx-ver" }
javafx-fxml = { module = "org.openjfx:javafx-fxml", version.ref = "javafx-ver" }
javafx-graphics = { module = "org.openjfx:javafx-graphics", version.ref = "javafx-ver" }
javafx-swing = { module = "org.openjfx:javafx-swing", version.ref = "javafx-ver" }

# --- iText ---
itext-barcodes = { module = "com.itextpdf:barcodes", version.ref = "itext-ver" }
itext-forms = { module = "com.itextpdf:forms", version.ref = "itext-ver" }
itext-kernel = { module = "com.itextpdf:kernel", version.ref = "itext-ver" }
itext-layout = { module = "com.itextpdf:layout", version.ref = "itext-ver" }
itext-io = { module = "com.itextpdf:io", version.ref = "itext-ver" }
itext-svg = { module = "com.itextpdf:svg", version.ref = "itext-ver" }

# Logging
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
kotlin-logging = { module = "io.github.oshai:kotlin-logging", version.ref = "kotlin-logging" }

# --- Misc ---
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
vosk = { module = "com.alphacephei:vosk-model-en", version.ref = "vosk-ver" }
vosk-api = { module = "com.alphacephei:vosk", version.ref = "vosk-ver" }
vosk-android = { module = "com.alphacephei:vosk-android", version.ref = "vosk-ver-android" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk-ver" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna-ver" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml-ver" }
controlsfx = { module = "org.controlsfx:controlsfx", version.ref = "controlsfx-ver" }
tilesfx = { module = "eu.hansolo:tilesfx", version.ref = "tilesfx-ver" }
formsfx = { module = "com.dlsc.formsfx:formsfx-core", version.ref = "formsfx-ver" }
ikonli = { module = "org.kordamp.ikonli:ikonli-javafx", version.ref = "ikonli-ver" }
cardview = { module = "androidx.cardview:cardview", version.ref = "cardview-ver" }
jacoco-ver = { module = "org.jacoco:org.jacoco.core", version.ref = "jacoco-ver" }
voyager-navigator = { group = "cafe.adriel.voyager", name = "voyagernavigator", version.ref = "voyager-ver" }
voyager-transitions = { group = "cafe.adriel.voyager", name = "voyager-transitions", version.ref = "voyager-ver" }


# --- Multiplatform Room / SQLite Core ---
#androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room-ver" }
#androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room-ver" }
androidx-sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite-bundled-ver" }
# ---Platform-specific Engines ---
spatialite-android = { group = "com.github.sevar83", name = "android-spatialite", version.ref = "spatialite-android-ver" }
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqlite-jdbc-ver" }
androidx-sqlite-framework = { group = "androidx.sqlite", name = "sqlite-framework", version.ref = "sqliteFramework" }


# ============================================================
#                          BUNDLES
# ============================================================

[bundles]
koin-android = ["koin-core", "koin-android", "koin-compose-android"]
koin-mpp = ["koin-core", "koin-annotations"]
coroutines = ["coroutines-core", "coroutines-android"]
testJvm = ["junit-jupiter-api", "junit-jupiter-engine", "kotlin-test", "mockk", "koin-test-junit5"]
testAndroid = ["androidx-junit", "espresso-core"]
javafx = ["javafx-base", "javafx-controls", "javafx-fxml", "javafx-graphics"]
itext = ["itext-kernel","itext-forms","itext-layout","itext-io"]
logging = ["slf4j-api", "logback-classic", "kotlin-logging"]
