# ============================================================
#                     VERSION CATALOG
#        Clean, cohesive, and modern Kotlin/Compose setup
# ============================================================

[versions]

# --- Core Toolchains (Upgraded to Modern Stack) ---
kotlin-ver = "2.4.0"
agp = "9.6.0-alpha02"
jvm = "21"

android-compileSdk = "37"
android-minSdk = "24"
android-targetSdk = "36"

# --- Jetpack & Core ---
lifecycle-ver = "2.8.7"
core-ktx-ver = "1.19.1" # was 1.19.0
activity-compose-ver = "1.10.0"
navigationevent-ver = "1.0.0"
cardview-ver = "1.0.0"

# --- AndroidX Graphics ---
graphics-core-ver = "1.0.4"
graphics-path-ver = "1.1.0"
graphics-shapes-ver = "1.1.0"

# --- Compose (AndroidX & Multiplatform) ---
compose-bom-ver = "2026.08.00" # was 2024.10.01
compose-mpp-ver = "1.8.0"
compose-mpp-material3-ver = "1.8.0"
compose-mpp-androidx-ver = "2.8.3"
compose-material-icons-ext-ver = "1.7.3"
compose-compiler-ver = "2.4.0"
runtime-ver = "1.11.2"

# --- KSP & Koin Ecosystem ---
ksp-ver = "2.1.10-1.0.31"
koin-ver = "4.2.0"
koin-annotations-ver = "4.2.0"
koin-plugin-ver = "1.2.1"

# --- Coroutines & Concurrency ---
coroutines-ver = "1.10.1"

# --- Testing ---
junit5-ver = "6.0.2"
androidx-junit-ver = "1.3.0"
espresso-ver = "3.7.0"
kotlin-test-ver = "2.4.0"
mockk-ver = "1.14.7"

# --- UI & Desktop ---
javafx-ver = "21.0.2"
javafx-plugin-ver = "0.1.0"
controlsfx-ver = "12.3.1"
tilesfx-ver = "21.0.9"
formsfx-ver = "11.6.0"
ikonli-ver = "12.4.0"
voyager-ver = "1.0.0"

# --- Logging & Serialization ---
slf4j-ver = "2.0.17"
logback-ver = "1.5.24"
kotlin-logging-ver = "7.0.14"
kotlinx-serialization-ver = "1.9.0"
kotlinx-datetime-ver = "0.6.0"
snakeyaml-ver = "2.5"
json-ver = "20240303"

# --- Documents, OCR & Audio ---
itext-ver = "9.7.0"
pdfbox-ver = "2.0.29"
pdfbox-android-ver = "2.0.27.0"
djl-core-ver = "0.31.0"
google-mlkit-text-ver = "16.0.1"
vosk-core-ver = "0.3.45"
vosk-android-ver = "0.3.75"
jna-ver = "5.18.1"

# --- SQLite & Storage ---
sqlite-jdbc-ver = "3.45.1.0"
spatialite-android-ver = "2.0.0"
sqlite-bundled-ver = "2.6.2"
sqlite-framework-ver = "2.6.2"
datastore-core-ver = "1.2.1"

# --- Build Tooling ---
google-autoservice-ver = "1.1.1"
dokka-ver = "2.2.0"
build-konfig-ver = "0.15.1"
jacoco-ver = "0.8.12"
pdfCore = "1.0.0-beta01"


# ============================================================
#                          PLUGINS
# ============================================================

[plugins]
# Kotlin

#ksp = { id = "com.google.devtools.ksp", version.ref = "ksp-ver" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin-ver" }
kotlinJvm           = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin-ver" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin-ver" }

# Android
androidLibrary      = { id = "com.android.library", version.ref = "agp" }
androidApplication  = { id = "com.android.application", version.ref = "agp" }
androidKmp          = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }

# Compose
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-mpp-ver" }
composeDesktopApp    = { id = "org.jetbrains.compose.desktop.application", version.ref = "compose-mpp-ver" }
composeCompiler      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin-ver" }
# compose-desktop-current = { group = "org.jetbrains.compose.desktop", name = "desktop-jvm-windows-x64", version.ref = "compose-mpp-ver" }

# Tooling & Infrastructure
dokka         = { id = "org.jetbrains.dokka", version.ref = "dokka-ver" }
javafx        = { id = "org.openjfx.javafxplugin", version.ref = "javafx-plugin-ver" }
buildkonfig   = { id = "com.codingfeline.buildkonfig", version.ref = "build-konfig-ver" }
koin-compiler = { id = "io.insert-koin.compiler.plugin", version.ref = "koin-plugin-ver" }


# ============================================================
#                         LIBRARIES
# ============================================================

[libraries]

# --- Plugin Artifacts (Required for build-logic) ---
android-gradle-plugin              = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradle-plugin               = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin-ver" }
kotlin-serialization-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-serialization", version.ref = "kotlin-ver" }
compose-gradle-plugin              = { group = "org.jetbrains.compose", name = "compose-gradle-plugin", version.ref = "compose-mpp-ver" }
compose-compiler-gradle-plugin     = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin-ver" }
ksp-gradle-plugin                  = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp-ver" }
dokka-gradle-plugin                = { group = "org.jetbrains.dokka", name = "dokka-gradle-plugin", version.ref = "dokka-ver" }
javafx-gradle-plugin               = { module = "org.openjfx.javafxplugin:org.openjfx.javafxplugin.gradle.plugin", version.ref = "javafx-plugin-ver" }

# --- AndroidX Core & Platform ---
core-ktx                  = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx-ver" }
lifecycle-runtime-ktx     = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle-ver" }
lifecycle-viewmodel-ktx   = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle-ver" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle-ver" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle-ver" }
androidx-navigationevent  = { module = "androidx.navigationevent:navigationevent", version.ref = "navigationevent-ver" }
cardview                  = { module = "androidx.cardview:cardview", version.ref = "cardview-ver" }

# --- AndroidX Graphics ---
androidx-graphics-core   = { group = "androidx.graphics", name = "graphics-core", version.ref = "graphics-core-ver" }
androidx-graphics-path   = { group = "androidx.graphics", name = "graphics-path", version.ref = "graphics-path-ver" }
androidx-graphics-shapes = { group = "androidx.graphics", name = "graphics-shapes", version.ref = "graphics-shapes-ver" }

# --- Compose (AndroidX) ---
compose-bom             = { module = "androidx.compose:compose-bom", version.ref = "compose-bom-ver" }
compose-ui              = { group = "androidx.compose.ui", name = "ui" }
compose-material        = { group = "androidx.compose.material", name = "material" }
compose-material3       = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-ext = { group = "org.jetbrains.compose.material", name = "material-icons-extended" }
compose-tooling         = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
activity-compose        = { module = "androidx.activity:activity-compose", version.ref = "activity-compose-ver" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime", version.ref = "runtime-ver" }

# --- Compose Multiplatform (JetBrains) ---
compose-mpp-runtime          = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "compose-mpp-ver" }
compose-mpp-foundation       = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "compose-mpp-ver" }
compose-mpp-material3        = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "compose-mpp-material3-ver" }
compose-mpp-material-icons-ext = { group = "org.jetbrains.compose.material", name = "material-icons-extended", version.ref = "compose-material-icons-ext-ver" }
compose-mpp-ui               = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "compose-mpp-ver" }
compose-mpp-viewmodel        = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "compose-mpp-androidx-ver" }
compose-mpp-desktop     = { module = "org.jetbrains.compose.desktop:desktop", version.ref = "compose-mpp-ver" }
compose-mpp-desktop-jvm = { module = "org.jetbrains.compose.desktop:desktop-jvm", version.ref = "compose-mpp-ver" }
compose-desktop = { group = "org.jetbrains.compose.desktop", name = "desktop", version.ref = "compose-mpp-ver" }
compose-desktop-windows-x64 = { group = "org.jetbrains.compose.desktop", name = "desktop-jvm-windows-x64", version.ref = "compose-mpp-ver" }
compose-desktop-macos-x64   = { group = "org.jetbrains.compose.desktop", name = "desktop-jvm-macos-x64", version.ref = "compose-mpp-ver" }
compose-desktop-linux-x64   = { group = "org.jetbrains.compose.desktop", name = "desktop-jvm-linux-x64", version.ref = "compose-mpp-ver" }

# --- Koin Ecosystem ---
koin-core            = { module = "io.insert-koin:koin-core", version.ref = "koin-ver" }
koin-android         = { module = "io.insert-koin:koin-android", version.ref = "koin-ver" }
koin-annotations     = { module = "io.insert-koin:koin-annotations", version.ref = "koin-annotations-ver" }
koin-ksp-compiler    = { module = "io.insert-koin:koin-ksp-api", version.ref = "koin-ver" }
koin-compose         = { module = "io.insert-koin:koin-compose", version.ref = "koin-ver" }
koin-compose-android = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin-ver" }
koin-test            = { module = "io.insert-koin:koin-test", version.ref = "koin-ver" }
koin-test-junit5     = { module = "io.insert-koin:koin-test-junit5", version.ref = "koin-ver" }

# --- Coroutines ---
coroutines-core    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines-ver" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines-ver" }
coroutines-test    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines-ver" }

# --- Testing ---
junit-jupiter-api    = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit5-ver" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit5-ver" }
