# ============================================================
#                     VERSION CATALOG
#        Clean, cohesive, and modern Kotlin/Compose setup
# ============================================================

[versions]

# --- Core Toolchains ---
kotlin-ver = "2.3.0"
agp = "9.0.0-rc03"
jvm = "17"

android-compileSdk = "36"
android-minSdk = "24"
android-targetSdk = "36"

# --- Compose ---
compose-mpp = "1.9.3"              # Compose Multiplatform (Desktop + shared)
compose-compiler = "2.2.21"        # Must match Kotlin
compose-bom-ver = "2024.10.00"         # AndroidX Compose BOM

activity-compose = "1.12.0"

# --- Koin + KSP ---
koin = "4.1.1"
koin-annotations-ver = "2.3.0"
koin-compiler-ver = "2.3.0"
ksp-ver = "2.3.2"               # Must match Kotlin but 2.3.0 exists 2.2.21 doesn't


# --- Coroutines ---
coroutines = "1.8.0"

# --- Testing ---
junit5-ver = "5.10.2"
androidx-junit-ver = "1.1.5"
espresso-ver = "3.7.0"
kotlin-test-ver = "2.2.21"

# --- JavaFX ---
javafx = "21.0.8"

# --- Logging ---
slf4j = "2.0.9"
logback = "1.4.14"
kotlin-logging = "7.0.7"

# --- iText ---
itext-ver = "9.4.0"

# --- Misc ---
kotlinxSerialization = "1.9.0"
mockk-ver = "1.12.4"
jna-ver = "5.13.0"
snakeyaml-ver = "2.0"
dokka-ver = "2.1.0"
vosk-ver = "0.3.45"
vosk-ver-android = "0.3.32"
controlsfx-ver = "11.2.2"
tilesfx-ver = "21.0.3"
formsfx-ver = "11.6.0"
ikonli-ver = "12.3.1"
cardview-ver = "1.0.0"
jacoco-ver = "0.8.11"

# ============================================================
#                          PLUGINS
# ============================================================

[plugins]
# Kotlin
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin-ver" }
kotlinAndroid       = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin-ver" }
kotlinJvm           = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin-ver" }

# Android
androidLibrary      = { id = "com.android.library", version.ref = "agp" }
androidApplication  = { id = "com.android.application", version.ref = "agp" }


# Compose
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-mpp" } # ✅ shared UI + Android
composeDesktopApp    = { id = "org.jetbrains.compose.desktop.application", version.ref = "compose-mpp" } # ✅ desktop launcher
# --- Keep note: composeMobile became composeCompiler, must aligned with kotlin version
# --- and composeDesktop became composeMultiplatform
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin-ver" }


# Tooling
ksp   = { id = "com.google.devtools.ksp", version.ref = "ksp-ver" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka-ver" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin-ver" }


# ============================================================
#                         LIBRARIES
# ============================================================

[libraries]

# --- AndroidX Core ---
core-ktx = { module = "androidx.core:core-ktx", version = "1.17.0" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version = "2.8.0" }

# --- Compose (AndroidX) ---
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom-ver" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }

# --- Compose Compiler ---
compose-compiler = { module = "org.jetbrains.compose.compiler:compiler", version.ref = "compose-compiler" }
compose-mpp-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "compose-mpp" }
compose-mpp-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "compose-mpp" }
compose-mpp-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "compose-mpp" }


# --- Koin ---
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }
koin-annotations = { module = "io.insert-koin:koin-annotations", version.ref = "koin-annotations-ver" }
koin-compiler = { module = "io.insert-koin:koin-ksp-compiler", version.ref = "koin-compiler-ver" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }
koin-test-junit5 = { module = "io.insert-koin:koin-test-junit5", version.ref = "koin" }

# --- Coroutines ---
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# --- JUnit 5 ---
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit5-ver" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit5-ver" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit5-ver" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-junit-ver" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso-ver" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin-test-ver" }

# --- JavaFX ---
javafx-base = { module = "org.openjfx:javafx-base", version.ref = "javafx" }
javafx-controls = { module = "org.openjfx:javafx-controls", version.ref = "javafx" }
javafx-fxml = { module = "org.openjfx:javafx-fxml", version.ref = "javafx" }
javafx-graphics = { module = "org.openjfx:javafx-graphics", version.ref = "javafx" }
javafx-swing = { module = "org.openjfx:javafx-swing", version.ref = "javafx" }

# --- iText ---
itext-barcodes = { module = "com.itextpdf:barcodes", version.ref = "itext-ver" }
itext-forms = { module = "com.itextpdf:forms", version.ref = "itext-ver" }
itext-kernel = { module = "com.itextpdf:kernel", version.ref = "itext-ver" }
itext-layout = { module = "com.itextpdf:layout", version.ref = "itext-ver" }
itext-io = { module = "com.itextpdf:io", version.ref = "itext-ver" }
itext-svg = { module = "com.itextpdf:svg", version.ref = "itext-ver" }

# Logging
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
kotlin-logging = { module = "io.github.oshai:kotlin-logging", version.ref = "kotlin-logging" }

# --- Misc ---
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
vosk = { module = "com.alphacephei:vosk-model-en", version.ref = "vosk-ver" }
vosk-android = { module = "com.alphacephei:vosk-android", version.ref = "vosk-ver-android" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk-ver" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna-ver" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml-ver" }
controlsfx = { module = "org.controlsfx:controlsfx", version.ref = "controlsfx-ver" }
tilesfx = { module = "eu.hansolo:tilesfx", version.ref = "tilesfx-ver" }
formsfx = { module = "com.dlsc.formsfx:formsfx-core", version.ref = "formsfx-ver" }
ikonli = { module = "org.kordamp.ikonli:ikonli-javafx", version.ref = "ikonli-ver" }
cardview = { module = "androidx.cardview:cardview", version.ref = "cardview-ver" }
jacoco-core = { module = "org.jacoco:org.jacoco.core", version.ref = "jacoco-ver" }

# ============================================================
#                          BUNDLES
# ============================================================

[bundles]

#compose-android = ["compose-ui", "compose-material3", "activity-compose"]
koin-android = ["koin-core", "koin-android", "koin-compose"]
koin-mpp = ["koin-core", "koin-annotations"]
coroutines = ["coroutines-core", "coroutines-android"]
testJvm = ["junit-jupiter-api", "junit-jupiter-engine", "kotlin-test", "mockk", "koin-test-junit5"]
testAndroid = ["androidx-junit", "espresso-core"]
javafx = ["javafx-base", "javafx-controls", "javafx-fxml", "javafx-graphics"]
itext = ["itext-kernel","itext-forms","itext-layout","itext-io"]
logging = ["slf4j-api", "logback-classic", "kotlin-logging"]
