# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/build_environment.html#sec:gradle_configuration_properties

org.gradle.configuration-cache=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX support
android.useAndroidX=true


# Kotlin settings
kotlin.code.style=official

# Android build optimizations
android.nonTransitiveRClass=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false

# AGP 9.0 KMP Compatibility bypass
# This allows 'com.android.library' and 'org.jetbrains.kotlin.multiplatform'
# to work together as they did in AGP 8.x
#android.builtInKotlin=true
#android.newDsl=true

# Allow Kotlin source sets in Android modules
android.disallowKotlinSourceSets=true
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
kotlin.mpp.androidSourceSetLayoutV2=true
kotlin.mpp.enableCInteropCommonization=true