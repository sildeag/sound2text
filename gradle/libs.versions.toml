voyager-navigator   = { group = "cafe.adriel.voyager", name = "voyagernavigator", version.ref = "voyager-ver" }
voyager-transitions = { group = "cafe.adriel.voyager", name = "voyager-transitions", version.ref = "voyager-ver" }

# --- iText ---
itext-barcodes = { module = "com.itextpdf:barcodes", version.ref = "itext-ver" }
itext-forms    = { module = "com.itextpdf:forms", version.ref = "itext-ver" }
itext-kernel   = { module = "com.itextpdf:kernel", version.ref = "itext-ver" }
itext-layout   = { module = "com.itextpdf:layout", version.ref = "itext-ver" }
itext-io       = { module = "com.itextpdf:io", version.ref = "itext-ver" }
itext-svg      = { module = "com.itextpdf:svg", version.ref = "itext-ver" }

# --- PDFBox, OCR & Audio ---
pdfbox                 = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox-ver" }
pdfbox-android         = { module = "com.tom-roush:pdfbox-android", version.ref = "pdfbox-android-ver" }
djl-api                = { module = "ai.djl:api", version.ref = "djl-core-ver" }
djl-onnx               = { module = "ai.djl.onnxruntime:onnxruntime-engine", version.ref = "djl-core-ver" }
mlkit-text-recognition = { module = "com.google.android.gms:play-services-mlkittext-recognition", version.ref = "google-mlkit-text-ver" }
vosk-core              = { group = "com.alphacephei", name = "vosk", version.ref = "vosk-core-ver" }
vosk-android           = { group = "com.alphacephei", name = "vosk-android", version.ref = "vosk-android-ver" }
vosk-model-en          = { group = "com.alphacephei", name = "vosk-model-en", version.ref = "vosk-core-ver" }
jna-android            = { group = "net.java.dev.jna", name = "jna", version.ref = "jna-ver" }

# --- Logging & Serialization ---
slf4j-api                  = { module = "org.slf4j:slf4j-api", version.ref = "slf4j-ver" }
logback-classic            = { module = "ch.qos.logback:logback-classic", version.ref = "logback-ver" }
kotlin-logging             = { module = "io.github.oshai:kotlin-logging", version.ref = "kotlin-logging-ver" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-ver" }
kotlinx-datetime           = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime-ver" }
snakeyaml                  = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml-ver" }
org-json                   = { module = "org.json:json", version.ref = "json-ver" }

# --- Multiplatform Room, SQLite & Storage ---
# androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room-ver" }
# androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room-ver" }
androidx-sqlite-bundled   = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite-bundled-ver" }
androidx-sqlite-framework = { group = "androidx.sqlite", name = "sqlite-framework", version.ref = "sqlite-framework-ver" }
spatialite-android        = { group = "com.github.sevar83", name = "android-spatialite", version.ref = "spatialite-android-ver" }
sqlite-jdbc               = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqlite-jdbc-ver" }
androidx-datastore-core   = { group = "androidx.datastore", name = "datastore-core", version.ref = "datastore-core-ver" }

# --- Misc Tooling ---
google-autoservice-annotations = { group = "com.google.auto.service", name = "auto-service-annotations", version.ref = "google-autoservice-ver" }
google-autoservice-processor   = { group = "com.google.auto.service", name = "auto-service", version.ref = "google-autoservice-ver" }
jacoco-core                    = { module = "org.jacoco:org.jacoco.core", version.ref = "jacoco-ver" }
androidx-pdf-core = { group = "androidx.pdf", name = "pdf-core", version.ref = "pdfCore" }


# ============================================================
#                          BUNDLES
# ============================================================

[bundles]
koin-android = ["koin-core", "koin-android", "koin-compose-android"]
koin-mpp     = ["koin-core", "koin-annotations"]
coroutines   = ["coroutines-core", "coroutines-android"]
testJvm      = ["junit-jupiter-api", "junit-jupiter-engine", "kotlin-test", "mockk", "koin-test-junit5"]
testAndroid  = ["androidx-junit", "espresso-core"]
javafx       = ["javafx-base", "javafx-controls", "javafx-fxml", "javafx-graphics"]
itext        = ["itext-kernel", "itext-forms", "itext-layout", "itext-io"]
logging      = ["slf4j-api", "logback-classic", "kotlin-logging"]