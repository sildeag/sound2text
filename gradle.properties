# ==============================================================================
# 1. MEMORY CEILING & DAEMON CONFIGURATION (8GB RAM SAFE MODE)
# ==============================================================================
# Cap the main Gradle process memory footprint sharply (leaves breathing room for IDE & OS)
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dfile.encoding=UTF-8

# Strictly limit the background Kotlin compiler daemon memory & metaspace
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC

# Keep daemons alive between builds so you don't pay the JVM startup/warmup cost repeatedly
org.gradle.daemon=true

# ALTERNATIVE LOW-RAM FALLBACK: If two separate daemons still trigger SSD swap/OOM,
# uncomment the two lines below (and comment out kotlin.daemon.jvmargs above) to run
# Kotlin inside Gradle's single JVM, saving ~1 GB of native overhead:
# kotlin.compiler.execution.strategy=in-process
# org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dfile.encoding=UTF-8


# ==============================================================================
# 2. CONCURRENCY CONTROL (PREVENT 4-CORE CPU & RAM SPIKES)
# ==============================================================================
# Disable memory-intensive parallel task processing on an 8GB machine
org.gradle.parallel=false

# Restrict max worker threads so parallel tasks don't freeze the OS
org.gradle.workers.max=2

# Disable parallel sync for Gradle 9.4+ to prevent IDE sync memory spikes
org.gradle.tooling.parallel=false


# ==============================================================================
# 3. CACHING & INCREMENTAL BUILD SPEEDUPS
# ==============================================================================
# Cache your configuration graph completely (bypasses configuration phase on subsequent builds)
org.gradle.configuration-cache=true

# Cache compiled code blocks and task outputs between builds
org.gradle.caching=true

# Ensure Kotlin incremental compilation and classpath snapshots are active
kotlin.incremental=true
#kotlin.incremental.useClasspathSnapshot=true
kotlin.compiler.execution.strategy=in-process


# ==============================================================================
# 4. KOTLIN & ANDROID BUILD OPTIMIZATIONS
# ==============================================================================
kotlin.code.style=official

# Generate non-transitive R classes to reduce resource compilation memory and APK/DEX size
android.nonTransitiveRClass=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.useAndroidX=true

# Disable Jetifier to save CPU and RAM during dependency resolution
# (Switch back to true ONLY if an old legacy library fails to build)
android.enableJetifier=false

# Allow Kotlin source sets in Android modules & KMP layout settings
android.disallowKotlinSourceSets=false
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
kotlin.mpp.androidSourceSetLayoutV2=true
kotlin.mpp.enableCInteropCommonization=true